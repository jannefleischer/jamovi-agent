# Tests on every push; build on every push (artifacts kept for a week);
# release on tags vX.Y.Z: files go to the generic package registry and a
# GitLab release links them.
stages: [test, build, release]

variables:
  R_IMAGE: rocker/r-ver:4.6.0       # R version of the target jamovi (28.x: 4.6.0)
  JAMOVI_REF: v28.14                # jamovi git ref that provides jamovi-compiler
  JAMOVI_APP_VERSION: 28.18.0       # target jamovi version
  PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/jamovi-agent/${CI_COMMIT_TAG}

unit-tests:
  stage: test
  image: python:3.12-slim
  script:
    - python3 -m unittest discover -s tests

build:
  stage: build
  image: ${R_IMAGE}
  script:
    - VERSION="${CI_COMMIT_TAG#v}" ci/build.sh
  artifacts:
    paths: [dist/]
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: [build]
  script:
    - apk add --no-cache curl
    - |
      set --
      for f in dist/*; do
        name=$(basename "$f")
        curl --fail -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${PACKAGE_URL}/${name}"
        set -- "$@" --assets-link "{\"name\":\"${name}\",\"url\":\"${PACKAGE_URL}/${name}\",\"link_type\":\"package\"}"
      done
      release-cli create --name "jamovi-agent ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" \
        --description "Build of ${CI_COMMIT_TAG}. Installation: see README.md." "$@"
